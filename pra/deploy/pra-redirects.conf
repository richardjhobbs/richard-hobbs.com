# /etc/nginx/snippets/pra-redirects.conf
# Addresses from the old Squarespace site, sent to the matching place on the new one.

location = /home                                   { return 301 /; }
location = /new-cover-page                         { return 301 /; }

location = /pra-services                           { return 301 /#services; }
location = /pra-esg-risk-advisory-strategies       { return 301 /#services; }
location = /pra-corporate-sustainability-strategy  { return 301 /#services; }
location = /pra-operational-effectiveness          { return 301 /#services; }
location = /pra-management-systems-development     { return 301 /#services; }
location = /pra-transactional-services             { return 301 /#services; }
location = /pra-technical-services                 { return 301 /#services; }

location = /pra-clients                            { return 301 /#who; }
location = /pra-values                             { return 301 /#values; }

location = /pra-partners                           { return 301 /#network; }
location = /pra-advisors                           { return 301 /#network; }
location = /pra-global-map                         { return 301 /#network; }
location = /inogen-alliance                        { return 301 /#network; }
location = /clean-future-group                     { return 301 /#network; }
location = /clean-future-technologies              { return 301 /#network; }

location = /company-information                    { return 301 /#about; }
location = /pra-our-advisors                       { return 301 /#about; }
location = /pra-awards-and-announcements           { return 301 /#about; }
location = /pra-media-and-events                   { return 301 /#about; }
location = /pra-capability-statement               { return 301 /#about; }
location = /pra-digital-brochure                   { return 301 /#about; }

location = /pra-offices                            { return 301 /#contact; }
location = /contact-us                             { return 301 /#contact; }

location = /pra-terms-and-conditions               { return 301 /legal.html#terms; }
location = /pra-data-privacy-policy                { return 301 /legal.html#privacy; }

# Documents that used to sit under /s/ on Squarespace
location ~ ^/s/(.+\.pdf)$                          { return 301 /docs/$1; }
