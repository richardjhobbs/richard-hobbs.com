# /etc/nginx/sites-available/pacificriskadvisors.com
# Production vhost for the Pacific Risk Advisors site. Installed once by apply.sh and then left alone,
# because certbot edits this file when go-live.sh issues the certificate.
# Old-address redirects live in /etc/nginx/snippets/pra-redirects.conf, which apply.sh refreshes on every deploy.

server {
    listen 80;
    listen [::]:80;
    server_name pacificriskadvisors.com;
    return 301 $scheme://www.pacificriskadvisors.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.pacificriskadvisors.com;

    root /var/www/pra.richard-hobbs.com/site-prod;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include snippets/pra-redirects.conf;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|png|jpg|json|txt|pdf|xml)$ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # MCP server and the site's enquiry form
    location ~ ^/(mcp|api/enquiry|healthz)$ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 64k;
    }
}
