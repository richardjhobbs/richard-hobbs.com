# /etc/nginx/sites-available/pra.richard-hobbs.com
# Review build of the Pacific Risk Advisors site. certbot adds the TLS server block.
server {
    listen 80;
    listen [::]:80;
    server_name pra.richard-hobbs.com;

    root /var/www/pra.richard-hobbs.com/site;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|png|json|txt)$ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # MCP server and the site's enquiry form
    location ~ ^/(mcp|api/enquiry|healthz)$ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 64k;
    }
}
